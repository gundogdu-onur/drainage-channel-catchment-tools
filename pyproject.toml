[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is handled by the formatter; long user-facing messages stay on one line.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["drainage_channel_catchment_tools"]
